[pytest]
# Phase 2: formal test framework for the pet-desktop baseline.
testpaths = tests
markers =
    unit: fast, no GUI, no disk outside test temp (run: pytest tests/unit -q)
    integration: real subsystems wired together (run: pytest tests/integration -q)
    smoke: GUI construction and lifecycle, QWebEngine offscreen (run: pytest tests/smoke -q)
    gui: requires QApplication; runs under QT_QPA_PLATFORM=offscreen
    baseline: characterization of upstream behavior at 1d89c85 (may include strict xfail for known issues)
addopts = --strict-markers
